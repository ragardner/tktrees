[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tktrees"
description = "Tkinter hierarchy management tool"
readme = "README.md"
version = "1.14.22"
authors = [{ name = "ragardner", email = "github@ragardner.simplelogin.com" }]
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
keywords = ["tkinter", "table", "tree", "hierarchy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Other/Nonlisted Topic",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
"Homepage" = "https://github.com/ragardner/tktrees-src"
"Bug Reports" = "https://github.com/ragardner/tktrees-src/issues"
"Funding" = "https://github.com/ragardner"

[tool.ruff]
line-length = 120
extend-exclude = [
    "defusedxml",
    "et_xmlfile",
    "openpyxl",
    "tksheet",
]

[tool.ruff.lint]
extend-select = ["I", "F", "C4", "E", "B", "SIM"]
ignore = [
    "E501",
    "SIM401",
    "BLE001",  # broad except Exception is intentional
    "S110",    # try/except/pass — same reason
    "S112",    # try/except/continue — same reason
    "TRY002",
    "DTZ",     # calendar dates, not timestamps — no timezone to attach
]
