#
# No PyPI installs. Tests use the stdlib and the vendored copies of
# tksheet / openpyxl / defusedxml / et_xmlfile that ship in this repo.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Tcl/Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk libtk8.6 xvfb

      - name: Vendored packages resolve from this repo
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tksheet
          import openpyxl
          import defusedxml
          import et_xmlfile

          root = os.path.abspath(os.getcwd())
          for mod in (tksheet, openpyxl, defusedxml, et_xmlfile):
              path = os.path.abspath(mod.__file__)
              if not path.startswith(root + os.sep) and path != os.path.join(root, os.path.basename(path)):
                  raise SystemExit(f"{mod.__name__} imported from outside the repo: {path}")
              print(f"{mod.__name__}: {path}")
          PY

      - name: Compile
        run: python -m compileall -q -f src tests TKTREES.pyw

      - name: Unittest
        shell: bash
        env:
          REQUIRE_GUI_TESTS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi

      - name: API help (no GUI)
        shell: bash
        run: |
          python TKTREES.pyw --help
          python TKTREES.pyw flatten --help
          python TKTREES.pyw unflatten --help
          python TKTREES.pyw --version

      - name: CLI smoke (no GUI)
        shell: bash
        run: |
          python TKTREES.pyw cli -c status
          python TKTREES.pyw cli --json -c status
          python TKTREES.pyw cli --help
          set +e
          python TKTREES.pyw cli add Lion
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 from leftover argv after cli, got $status"
            exit 1
          fi

      - name: Unknown command exits 2
        shell: bash
        run: |
          set +e
          python TKTREES.pyw not-a-command
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 from unknown command, got $status"
            exit 1
          fi

      - name: Tests path is not gitignored
        shell: bash
        run: |
          if git check-ignore -q tests/test_session_load.py; then
            echo "tests/test_session_load.py is gitignored"
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: "."
          args: "check"
